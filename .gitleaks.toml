# gitleaks configuration: the default rules plus this repository's own patterns.
# Run through scripts/secret-scan.sh (before every push) and in CI.

title = "solana-night-market"

[extend]
useDefault = true

# ── Custom rules ─────────────────────────────────────────────────────────────

[[rules]]
id = "env-style-wallet-secret"
description = "A wallet secret assigned in an env-style file (WALLET=, SK=, SEED=, MNEMONIC=, PRIVATE_KEY=, SPONSOR_SEED=)"
regex = '''(?im)^\s*(?:export\s+)?(?:WALLET|SK|SEED|MNEMONIC|PRIVATE_KEY|SPONSOR_SEED|DEPLOYER_KEY)\s*=\s*["']?((?:[a-z]{3,8}[ \t]+){11,23}[a-z]{3,8}|[^\s"'#]{16,})'''
keywords = ["wallet=", "sk=", "seed=", "mnemonic=", "private_key=", "sponsor_seed=", "deployer_key="]

[[rules]]
id = "bip39-mnemonic-labelled"
description = "Twelve to twenty-four lowercase words after a seed, mnemonic or recovery-phrase label"
regex = '''(?i)(?:mnemonic|seed ?phrase|recovery ?phrase|secret ?phrase)["'\s:=]+((?:[a-z]{3,8}[ \t]+){11,23}[a-z]{3,8})\b'''
keywords = ["mnemonic", "seed phrase", "seedphrase", "recovery phrase", "secret phrase"]

[[rules]]
id = "keyed-rpc-url"
description = "An RPC URL that carries a provider API key"
regex = '''https://[a-z0-9.-]*(?:infura\.io|alchemy\.com|alchemyapi\.io|quiknode\.pro|ankr\.com|drpc\.org|blastapi\.io|chainstack\.com|getblock\.io|nodereal\.io|tenderly\.co)/[A-Za-z0-9/_-]{16,}'''
keywords = ["infura", "alchemy", "quiknode", "ankr", "drpc", "blastapi", "chainstack", "getblock", "nodereal", "tenderly"]

[[rules]]
id = "labelled-hex-private-key"
description = "A 32-byte hex value labelled as a private, secret or signing key"
regex = '''(?i)(?:private[_-]?key|secret[_-]?key|signing[_-]?key|seed[_-]?hex)["']?\s*[:=]\s*["']?(?:0x)?([0-9a-f]{64})\b'''
keywords = ["private", "secret", "signing", "seed"]

# ── Allowlists ───────────────────────────────────────────────────────────────

[[allowlists]]
description = "Not this repository's content: the Passport submodule (upstream's own tree), installs and caches"
paths = [
  '''(^|/)vendor/passport/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.tools/''',
  '''(^|/)bun\.lock$''',
]

# The vendored PR #4 deployment records (MN Bank's; removed in AA 00047 and kept here for the
# history scan, which still reads them in `main`'s commits): the values the default generic-api-key
# rule flags there are PUBLIC keys (the MPC's and the deployer's) and the SHA-256 of a PUBLIC
# verifier key (the MIP-0018 circuit's, which PR #4's description lists; since the 6c7505a
# re-vendor). Scoped to that rule, those files AND those field names only. (A top-level [[allowlists]] with targetRules does not reach a
# default rule in gitleaks 8.28; extending the rule's own allowlist does.)
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)packages/core/src/tokens/deployments/[a-z0-9-]+\.json$''']
regexTarget = "match"
regexes = ['''^(?:mpcResponseKey|mpcRootPublicKey|deployerPublicKey|publishTokenMetadata|verifierKeySha256)"''']

# The vendored effectstream/mint-test-tokens registry (PROVENANCE.md, byte for byte): the values the
# rule flags there are PUBLIC token types (each token's colour, `tokenId`). Scoped to that rule,
# that file AND that field.
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)packages/core/src/tokens/mint-test-tokens/metadata\.stagenet\.json$''']
regexTarget = "match"
regexes = ['''^tokenId"''']

# The same registry as the web build bundles it (a JS object: `tokenId:` then the 64-hex token type
# in backticks). Scoped to that rule, the built bundle AND that exact shape.
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)web/dist/assets/[^/]+\.js(\.map)?$''']
regexTarget = "match"
regexes = ['''^tokenId:`[0-9a-f]{64}`''']

# The staging kernel's GET /v1/known-tokens, captured verbatim (a test fixture): the values the
# rule flags there are PUBLIC token colours. Scoped to that rule, that capture AND that field.
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)packages/core/test/fixtures/kernel/staging-[0-9-]+/known-tokens\.json$''']
regexTarget = "match"
regexes = ['''^token_color"''']

# The web bundle carries the onchain-runtime's wasm-bindgen glue (the browser-safe Passport
# client, plan P0.4): its generated import names (`__wbg_<name>_<16 hex>`) and one exported
# function name are code identifiers, not secrets. So is `verifyEd25519Strict`, the Solana
# envelope scheme's verifier (packages/core/src/solana-auth.ts, AA 00047), which the source map's
# names list carries next to a `…Key` identifier, and `ed25519SignatureHex` (core passport, bundled
# since AA 00047 P9.S's account check uses `ed25519DeviceForKey`). Scoped to that rule, the built
# bundle AND those exact shapes only.
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)web/dist/assets/[^/]+\.js(\.map)?$''']
regexTarget = "secret"
regexes = ['''^__wbg_[A-Za-z0-9_]+_[0-9a-f]{16}$''', '''^signingKeyFromBip340$''', '''^verifyEd25519Strict$''', '''^ed25519SignatureHex$''']

# deploy/.env.example pins the relay's key-set fingerprint: a SHA-256 over PUBLIC verifier keys,
# which the generic rule flags because the variable's name holds "KEY". Scoped to that rule, that
# file AND that exact assignment.
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)deploy/\.env\.example$''']
regexTarget = "match"
regexes = ['''^RELAY_KEYS_FINGERPRINT=[0-9a-f]{64}$''']
# AA 00060: the I-5 (landing key) test vectors carry the message text, whose last line is
# `Key: <wallet address>`, the test key's PUBLIC Solana address (base58), which the generic rule flags
# because the line is labelled "Key". Scoped to that rule, that fixture AND that exact shape (the
# JSON-escaped newline's `n`, `Key: `, a base58 address, the closing quote).
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)packages/core/test/fixtures/landing-key-v1\.json$''']
regexTarget = "match"
regexes = ['''^nKey: [1-9A-HJ-NP-Za-km-z]{32,44}"$''']
# The web build's pinned account verifier keys (AA 00047 P9.S, packages/core/src/passport/
# pinned-account-keys.ts, generated by scripts/pin-account-keys.ts) and the tests' copy of those
# PUBLIC verifier keys (test/fixtures/account-verifier-keys.json): SHA-256 digests of public verifier
# keys, the key set's fingerprint (the same value as RELAY_KEYS_FINGERPRINT) and the public keys
# themselves, flagged because a circuit name (`rotate_enc_key_…`) or the field `keySet` holds "key".
# Scoped to that rule, those two files AND those exact shapes.
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)packages/core/src/passport/pinned-account-keys\.ts$''', '''(^|/)test/fixtures/account-verifier-keys\.json$''']
regexTarget = "match"
regexes = ['''^"?(?:keySet|[a-z0-9_]*key[a-z0-9_]*_with_ed25519)"?\s*:\s*["'][0-9a-f]{64,}''']
# The same pinned digests as the web build bundles them (a JS object: the field, then the 64-hex
# digest in backticks). Scoped to that rule, the built bundle AND that exact shape.
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)web/dist/assets/[^/]+\.js(\.map)?$''']
regexTarget = "match"
regexes = ['''^(?:keySet|[a-z0-9_]*key[a-z0-9_]*_with_ed25519):`[0-9a-f]{64}`''']

# relay/src/passport/arm.ts names the arm's circuits (AA 00047 P9.I): `rotateEncKey:
# 'rotate_enc_key_with_ed25519'` is a circuit id, flagged because the field's name holds "Key".
# Scoped to that rule, that file AND that exact assignment.
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)relay/src/passport/arm\.ts$''']
regexTarget = "match"
regexes = ['''^rotateEncKey:\s*'rotate_enc_key_with_ed25519'$''']
