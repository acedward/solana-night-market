# AA 00057 P2: the journey stack's own services, an override of Night Market's localnet
# (test/stack/p6/compose.yml: the Midnight node, the indexer 4.4.0-rc.1, the proof servers rc.6 and rc.8,
# the relay and the mock exchange), used by ./run-local.sh as
#
#   docker compose -f test/stack/p6/compose.yml -f e2e/compose.yml -p aa00057-<run> ...
#
# It adds 00059's injector (the RPC the wallet points at). The service block is AA 00059's
# `harness/nm/compose.injector.yml` (acedward/solana-token-injector @ b358a19f4b5fbcf7dd2b7d664a939a29c2472451,
# PR #2), with the journey registry generated by e2e/registry/build.ts. The image is built by run-local.sh
# from that pinned checkout with `docker build --pull=false` (nothing is pulled) under a per-run tag that
# is removed at `down`.
#
# The two bridge nodes are NOT here: each is 00058's reusable `deploy/standin/compose.bridge.yml`
# (effectstream @ 1c9f4959db1a9f004820c01fb321225bb255916c), started by run-local.sh as its own compose
# project (aa00057-<run>-x, aa00057-<run>-y) on this stack's network. The Solana validator is native
# (Agave 3.0.14 on the host, random 127.0.0.1 ports); the containers reach it as host.docker.internal.
#
# Published on 127.0.0.1 only: the injector's RPC/page/API on INJECTOR_PORT, its Solana websockets on
# INJECTOR_WS_PORT. Its upstream is the native validator; PUBLIC_URL is the origin the wallet's custom RPC
# uses, so it must be http://127.0.0.1:<INJECTOR_PORT> exactly (the I-4 text binds it).

services:
  # AA 00057 P3b.2 (00060 session finding S-2): the contract prover (rc.8) was OOM-killed at its cap after
  # several proofs, with restart policy `no`; the relay failed that job gracefully. Here it restarts on
  # failure, under an explicit memory cap and no swap beyond it.
  proof-server-rc8:
    restart: on-failure:5
    mem_limit: ${PS8_MEM_LIMIT:-12g}
    memswap_limit: ${PS8_MEM_LIMIT:-12g}

  injector:
    image: ${INJECTOR_IMAGE:-s00059/service:unset}
    pull_policy: never
    profiles: [injector]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: ${INJECTOR_MEM_LIMIT:-1g}
    depends_on:
      indexer:
        condition: service_started
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${INJECTOR_PORT:?}:8899'
      - '127.0.0.1:${INJECTOR_WS_PORT:?}:8900'
    volumes:
      - injector-data:/data
      - '${JOURNEY_FILE:?}:/run/journey/journey-tokens.undeployed.json:ro'
      # AA 00057 P3b.3 (Q10): the injector's own token file, generated from Night Market's full token list
      # (names, decimals such as twBTC 8, icons) over the injector's bundled file.
      - '${INJECTOR_TOKENS_FILE:?}:/run/journey/tokens.undeployed.json:ro'
    environment:
      HOST: '0.0.0.0'
      PORT: '8899'
      PUBLIC_URL: 'http://127.0.0.1:${INJECTOR_PORT:?}'
      UPSTREAM: 'http://host.docker.internal:${VALIDATOR_RPC_PORT:?}'
      UPSTREAM_WS: 'ws://host.docker.internal:${VALIDATOR_WS_PORT:?}'
      DATA_DIR: '/data'
      MIDNIGHT_NETWORK_ID: 'undeployed'
      MIDNIGHT_INDEXER_HTTP: 'http://indexer:8088/api/v4/graphql'
      MIDNIGHT_INDEXER_WS: 'ws://indexer:8088/api/v4/graphql/ws'
      DECRYPTOR_BIN: '/usr/local/bin/midnight-esk-decrypt'
      JOURNEY_REGISTRY: '/run/journey/journey-tokens.undeployed.json'
      TOKEN_REGISTRY: '/run/journey/tokens.undeployed.json'
      ACCOUNTS_ENABLED: '1'
      ACCOUNTS_POLL_MS: '${ACCOUNTS_POLL_MS:-5000}'
      LOG: 'true'

volumes:
  injector-data:
